<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1625" />
  <title>老二的小游戏</title>
  <style>
    :root {
      --bg: #12101a;
      --bg-card: #1e1a28;
      --bg-card-hover: #262033;
      --text: #f4f0ff;
      --muted: #a89bb8;
      --accent: #ff6b4a;
      --accent-soft: rgba(255, 107, 74, 0.15);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 107, 74, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(120, 80, 200, 0.08), transparent);
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(24px + var(--safe-top)) 20px calc(32px + var(--safe-bottom));
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.75rem, 6vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      color: var(--muted);
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .card:hover {
        background: var(--bg-card-hover);
        border-color: rgba(255, 107, 74, 0.35);
      }
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .card-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
    }

    .card-tag {
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .card-desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .play::after {
      content: "→";
      font-size: 16px;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.85;
    }

    footer a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <p class="badge">Project</p>
      <h1>老二的小游戏</h1>
      <p class="subtitle">选一个，点开就能玩 · 手机友好</p>
    </header>

    <main class="games">
      <a class="card" href="https://queued-frost-j475.here.now/" rel="noopener noreferrer">
        <div class="card-top">
          <span class="card-icon" aria-hidden="true">💣</span>
          <span class="card-tag">触屏 · 经典</span>
        </div>
        <div class="card-title">扫雷</div>
        <p class="card-desc">Windows 风格扫雷：单击翻开，长按插旗。初 / 中 / 高级可选。</p>
        <span class="play">开始游戏</span>
      </a>

      <a class="card" href="https://solar-tablet-mwys.here.now/" rel="noopener noreferrer">
        <div class="card-top">
          <span class="card-icon" aria-hidden="true">🎯</span>
          <span class="card-tag">3D · PWA</span>
        </div>
        <div class="card-title">尖锋战术</div>
        <p class="card-desc">战术射击手游网页版：横屏体验更佳，可添加到主屏幕当 App 用。</p>
        <span class="play">开始游戏</span>
      </a>

      <a class="card" href="https://mellow-memoir-kbcm.here.now/" rel="noopener noreferrer">
        <div class="card-top">
          <span class="card-icon" aria-hidden="true">🚌</span>
          <span class="card-tag">文字 · 约 8 分钟</span>
        </div>
        <div class="card-title">404号末班车</div>
        <p class="card-desc">雨夜加班赶末班车：点选项推进剧情，多种结局，支持本机存档。</p>
        <span class="play">开始游戏</span>
      </a>
    </main>

    <footer>
      <p>链接均为 HTTPS 公网试玩；部分站点为 here.now 匿名发布（约 24 小时有效，可在各游戏说明页认领永久地址）。</p>
    </footer>
  </div>
</body>
</html>
