<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>尖锋战术 · 简易 FPS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="overlay">
      <h1>尖锋战术</h1>
      <p>简易浏览器 FPS 原型</p>
      <p class="hint">WASD 移动 · 鼠标瞄准 · 空格跳 · 左键射击 · R 换弹</p>
      <button id="start">点击开始</button>
    </div>
    <div id="hud" class="hidden">
      <div id="hp">生命 <span>100</span></div>
      <div id="ammo">弹药 <span>30</span> / 90</div>
      <div id="crosshair">+</div>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
