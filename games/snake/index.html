<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d1f12" />
  <title>贪吃蛇 · 老二的小游戏</title>
  <style>
    :root {
      --bg: #0d1f12;
      --panel: #152818;
      --border: #2a4a32;
      --text: #e8f5e9;
      --muted: #8fbc8f;
      --snake: #66bb6a;
      --snake-head: #a5d6a7;
      --food: #ef5350;
      --accent: #ffd54f;
      --danger: #ff7043;
      --pad: #1e3a24;
      --pad-active: #43a047;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(12px + var(--safe-top)) 12px calc(16px + var(--safe-bottom));
    }

    header {
      width: min(100%, 420px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .chip strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .board-wrap {
      position: relative;
      width: min(100vw - 24px, 420px);
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a160c;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(8, 20, 10, 0.82);
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(180deg, #5cb860, #388e3c);
      color: #fff;
      box-shadow: 0 4px 0 #1b5e20;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1b5e20;
    }

    .hint {
      width: min(100%, 420px);
      margin: 10px 0 14px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    .controls {
      width: min(100%, 420px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto auto;
      gap: 8px;
      align-items: center;
      justify-items: center;
    }

    .pad-btn {
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 14px;
      background: var(--pad);
      color: var(--text);
      font-size: 1.4rem;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .pad-btn:active,
    .pad-btn.active {
      background: var(--pad-active);
    }

    .pad-up { grid-column: 2; grid-row: 1; }
    .pad-left { grid-column: 1; grid-row: 2; }
    .pad-down { grid-column: 2; grid-row: 2; margin-top: 8px; }
    .pad-right { grid-column: 3; grid-row: 2; }

    .actions {
      grid-column: 1 / -1;
      margin-top: 6px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-ghost {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: none;
      color: var(--text);
      padding: 10px 20px;
    }

    @media (min-width: 480px) {
      .hint kbd { display: inline; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>贪吃蛇</h1>
      <div class="subtitle">老二的小游戏</div>
    </div>
    <div class="stats">
      <span class="chip">得分 <strong id="score">0</strong></span>
      <span class="chip">最高 <strong id="best">0</strong></span>
    </div>
  </header>

  <div class="board-wrap" id="board-wrap">
    <canvas id="game" width="400" height="400" aria-label="贪吃蛇游戏区域"></canvas>
    <div class="overlay visible" id="overlay-start">
      <h2>准备开吃</h2>
      <p>滑动屏幕或点方向键控制蛇头<br />撞墙或咬到自己就结束</p>
      <button type="button" class="btn" id="btn-start">开始游戏</button>
    </div>
    <div class="overlay" id="overlay-gameover">
      <h2>游戏结束</h2>
      <p id="gameover-msg">本局得分 0</p>
      <button type="button" class="btn" id="btn-restart">再来一局</button>
    </div>
  </div>

  <p class="hint">在棋盘上<strong>滑动</strong>转向 · 下方<strong>方向键</strong> · 电脑可用<strong>方向键</strong></p>

  <div class="controls" aria-label="方向控制">
    <button type="button" class="pad-btn pad-up" data-dir="up" aria-label="上">▲</button>
    <button type="button" class="pad-btn pad-left" data-dir="left" aria-label="左">◀</button>
    <button type="button" class="pad-btn pad-down" data-dir="down" aria-label="下">▼</button>
    <button type="button" class="pad-btn pad-right" data-dir="right" aria-label="右">▶</button>
    <div class="actions">
      <button type="button" class="btn btn-ghost" id="btn-pause">暂停</button>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "laoer-snake-best-v1";
      const COLS = 20;
      const ROWS = 20;
      const BASE_MS = 140;
      const MIN_MS = 70;
      const SPEED_STEP_EVERY = 5;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const wrap = document.getElementById("board-wrap");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlayStart = document.getElementById("overlay-start");
      const overlayGameover = document.getElementById("overlay-gameover");
      const gameoverMsg = document.getElementById("gameover-msg");
      const btnStart = document.getElementById("btn-start");
      const btnRestart = document.getElementById("btn-restart");
      const btnPause = document.getElementById("btn-pause");

      let cell = canvas.width / COLS;
      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 10, y: 10 };
      let score = 0;
      let best = loadBest();
      let tickMs = BASE_MS;
      let timer = null;
      let running = false;
      let paused = false;
      let foodsEaten = 0;

      bestEl.textContent = String(best);

      function loadBest() {
        try {
          const v = localStorage.getItem(STORAGE_KEY);
          const n = parseInt(v, 10);
          return Number.isFinite(n) && n >= 0 ? n : 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem(STORAGE_KEY, String(best));
        } catch (_) {}
      }

      function resizeCanvas() {
        const rect = wrap.getBoundingClientRect();
        const size = Math.floor(Math.min(rect.width, rect.height));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        cell = canvas.width / COLS;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cssSize = size;
        canvas.style.width = cssSize + "px";
        canvas.style.height = cssSize + "px";
        draw();
      }

      function resetGame() {
        snake = [
          { x: 5, y: 10 },
          { x: 4, y: 10 },
          { x: 3, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        foodsEaten = 0;
        tickMs = BASE_MS;
        scoreEl.textContent = "0";
        placeFood();
        draw();
      }

      function placeFood() {
        const occupied = new Set(snake.map((s) => s.x + "," + s.y));
        let tries = 0;
        do {
          food = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS),
          };
          tries++;
        } while (occupied.has(food.x + "," + food.y) && tries < 500);
      }

      function setDirection(nx, ny) {
        if (!running || paused) return;
        if (nx === -dir.x && ny === -dir.y) return;
        nextDir = { x: nx, y: ny };
      }

      function step() {
        dir = nextDir;
        const head = snake[0];
        const nh = { x: head.x + dir.x, y: head.y + dir.y };

        if (nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS) {
          endGame();
          return;
        }

        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === nh.x && snake[i].y === nh.y) {
            endGame();
            return;
          }
        }

        snake.unshift(nh);

        if (nh.x === food.x && nh.y === food.y) {
          score += 10;
          foodsEaten++;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            saveBest();
          }
          if (foodsEaten % SPEED_STEP_EVERY === 0 && tickMs > MIN_MS) {
            tickMs = Math.max(MIN_MS, tickMs - 8);
            restartLoop();
          }
          placeFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);
        const c = w / COLS;

        ctx.fillStyle = "#0a160c";
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(42, 74, 50, 0.35)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * c, 0);
          ctx.lineTo(x * c, h);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * c);
          ctx.lineTo(w, y * c);
          ctx.stroke();
        }

        const pad = c * 0.08;
        ctx.fillStyle = "#ef5350";
        ctx.beginPath();
        ctx.arc(
          food.x * c + c / 2,
          food.y * c + c / 2,
          c / 2 - pad,
          0,
          Math.PI * 2
        );
        ctx.fill();

        snake.forEach((seg, i) => {
          ctx.fillStyle = i === 0 ? "#a5d6a7" : "#66bb6a";
          const rx = seg.x * c + pad;
          const ry = seg.y * c + pad;
          const rw = c - pad * 2;
          const r = Math.min(6, rw * 0.25);
          roundRect(ctx, rx, ry, rw, rw, r);
          ctx.fill();
        });

        if (paused && running) {
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = "#ffd54f";
          ctx.font = "bold 28px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("已暂停", w / 2, h / 2);
        }
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function restartLoop() {
        if (timer) clearInterval(timer);
        if (!running || paused) return;
        timer = setInterval(step, tickMs);
      }

      function startGame() {
        overlayStart.classList.remove("visible");
        overlayGameover.classList.remove("visible");
        resetGame();
        running = true;
        paused = false;
        btnPause.textContent = "暂停";
        restartLoop();
      }

      function endGame() {
        running = false;
        paused = false;
        if (timer) clearInterval(timer);
        timer = null;
        gameoverMsg.textContent = "本局得分 " + score + (score >= best && score > 0 ? " · 新纪录！" : "");
        overlayGameover.classList.add("visible");
        draw();
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        btnPause.textContent = paused ? "继续" : "暂停";
        if (paused) {
          if (timer) clearInterval(timer);
          timer = null;
        } else {
          restartLoop();
        }
        draw();
      }

      btnStart.addEventListener("click", startGame);
      btnRestart.addEventListener("click", startGame);
      btnPause.addEventListener("click", togglePause);

      document.querySelectorAll(".pad-btn").forEach((btn) => {
        const map = {
          up: [0, -1],
          down: [0, 1],
          left: [-1, 0],
          right: [1, 0],
        };
        const d = btn.getAttribute("data-dir");
        const [dx, dy] = map[d];
        const press = () => {
          btn.classList.add("active");
          setDirection(dx, dy);
        };
        const release = () => btn.classList.remove("active");
        btn.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          press();
        });
        btn.addEventListener("pointerup", release);
        btn.addEventListener("pointerleave", release);
        btn.addEventListener("pointercancel", release);
      });

      wrap.addEventListener(
        "touchstart",
        (e) => {
          if (!running || paused) return;
          const t = e.changedTouches[0];
          wrap._swipe = { x: t.clientX, y: t.clientY };
        },
        { passive: true }
      );

      wrap.addEventListener(
        "touchend",
        (e) => {
          if (!wrap._swipe || !running || paused) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - wrap._swipe.x;
          const dy = t.clientY - wrap._swipe.y;
          const ax = Math.abs(dx);
          const ay = Math.abs(dy);
          if (Math.max(ax, ay) < 24) {
            wrap._swipe = null;
            return;
          }
          if (ax > ay) setDirection(dx > 0 ? 1 : -1, 0);
          else setDirection(0, dy > 0 ? 1 : -1);
          wrap._swipe = null;
        },
        { passive: true }
      );

      window.addEventListener("keydown", (e) => {
        const k = e.key;
        if (k === "ArrowUp") setDirection(0, -1);
        else if (k === "ArrowDown") setDirection(0, 1);
        else if (k === "ArrowLeft") setDirection(-1, 0);
        else if (k === "ArrowRight") setDirection(1, 0);
        else if (k === " " || k === "p" || k === "P") {
          e.preventDefault();
          togglePause();
        } else if (k === "Enter" && !running) startGame();
      });

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      draw();
    })();
  </script>
</body>
</html>
