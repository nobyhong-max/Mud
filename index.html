<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>张三的小游戏 · Pulse Strike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/game.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Title / Character select -->
      <section id="screen-menu" class="screen active">
        <div class="menu-bg"></div>
        <div class="menu-shell">
          <div class="menu-scroll">
            <div class="menu-panel">
            <div class="menu-toolbar">
              <button id="btn-settings-menu" class="ghost-btn" type="button">键位设置</button>
            </div>
              <p class="eyebrow">张三的小游戏</p>
              <h1 class="brand">PULSE STRIKE</h1>
              <p class="tagline">本地 3D 射击演示 · 无联网 · 打 AI 机器人</p>

              <h2 class="section-label">选择特工</h2>
              <div id="char-grid" class="select-grid"></div>

              <h2 class="section-label">选择地图</h2>
              <div id="map-grid" class="select-grid"></div>

              <p class="hint desktop-hint">WASD 移动 · 鼠标瞄准 · 左键射击 · R 换弹 · Q 技能 · Esc 暂停</p>
              <p class="hint mobile-hint">触控：左摇杆移动 · 右半屏滑动瞄准 · 开火/技能按钮</p>
            </div>
          </div>
          <div class="menu-cta-bar">
            <button id="btn-start" class="cta" type="button" disabled>开始对局 · START</button>
          </div>
        </div>
      </section>

      <!-- Match HUD overlay -->
      <section id="screen-game" class="screen">
        <canvas id="game-canvas"></canvas>
        <div id="crosshair"></div>
        <div id="hud">
          <div class="hud-top">
            <div class="score-box">
              <span id="score-you">0</span>
              <span class="vs">:</span>
              <span id="score-enemy">0</span>
            </div>
            <div id="round-label">第 1 回合 · 歼灭全部敌人</div>
          </div>
          <div class="hud-bottom">
            <div class="stat health">
              <span class="label">HP</span>
              <div class="bar"><i id="hp-fill"></i></div>
              <span id="hp-text">100</span>
            </div>
            <div class="stat ammo">
              <span id="ammo-text">30</span>
              <span class="slash">/</span>
              <span id="reserve-text">90</span>
            </div>
            <div class="stat ability">
              <span id="ability-tag" class="effect-tag">致盲</span>
              <span id="ability-name">致盲闪光</span>
              <button type="button" class="cd-ring" id="ability-cd" title="使用技能"><span id="ability-key-label">Q</span></button>
            </div>
          </div>
          <div id="binds-hint" class="binds-hint"></div>
          <canvas id="minimap" width="140" height="140"></canvas>
          <div id="obj-hint">歼灭敌方特工 · 先赢 3 回合</div>
        </div>
        <div id="flash-overlay"></div>
        <div id="damage-vignette"></div>
        <div id="kill-feed"></div>
        <div id="center-msg" class="hidden"></div>
        <div id="pause-menu" class="overlay-panel hidden">
          <h2>暂停</h2>
          <button id="btn-resume" type="button">继续</button>
          <button id="btn-settings-pause" type="button">键位设置</button>
          <button id="btn-quit" type="button">返回菜单</button>
        </div>
        <div id="touch-controls" class="hidden" aria-hidden="true">
          <div id="joy-zone">
            <div id="joy-base"><div id="joy-knob"></div></div>
          </div>
          <div id="touch-actions">
            <button type="button" id="btn-touch-ability" class="touch-btn">技能</button>
            <button type="button" id="btn-touch-reload" class="touch-btn">换弹</button>
            <button type="button" id="btn-touch-fire" class="touch-btn fire">开火</button>
            <button type="button" id="btn-touch-pause" class="touch-btn">‖</button>
          </div>
        </div>
      </section>

      <!-- Round / Match end -->
      <section id="screen-result" class="screen">
        <div class="menu-panel result-panel">
          <h2 id="result-title">胜利</h2>
          <p id="result-detail"></p>
          <button id="btn-rematch" class="cta" type="button">再来一局</button>
          <button id="btn-menu" type="button">返回选人</button>
        </div>
      </section>

      <div id="settings-panel" class="overlay-panel settings-panel hidden">
        <h2>键位设置</h2>
        <p class="settings-note">点击一项后按下新按键；鼠标左键可绑射击。</p>
        <div id="binds-list" class="binds-list"></div>
        <button id="btn-binds-reset" type="button">恢复默认</button>
        <button id="btn-settings-close" type="button">完成</button>
      </div>
    </div>
    <script type="module" src="./js/game/main.js"></script>
  </body>
</html>
