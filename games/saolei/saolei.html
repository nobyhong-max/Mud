<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>扫雷 — 手机触屏版</title>
  <style>
    /* 经典 Windows 扫雷复古灰色调 */
    :root {
      --win-gray: #c0c0c0;
      --win-dark: #808080;
      --win-light: #ffffff;
      --win-black: #000000;
      --cell-size: 32px;
      --board-max-w: 100vw;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", Tahoma, sans-serif;
      background: #008080;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    h1 {
      color: #fff;
      font-size: 1.1rem;
      font-weight: normal;
      margin: 4px 0 8px;
      text-shadow: 1px 1px 0 #004040;
    }

    .diff-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }

    .diff-bar button {
      font-size: 14px;
      padding: 8px 12px;
      min-height: 44px;
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      background: var(--win-gray);
      cursor: pointer;
    }

    .diff-bar button.active {
      background: #dfdfdf;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
    }

    .game-shell {
      background: var(--win-gray);
      border: 3px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      padding: 6px;
      max-width: calc(100vw - 16px);
    }

    .top-panel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      padding: 4px;
      border: 2px solid;
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
    }

    .counter {
      font-family: "Courier New", Consolas, monospace;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: bold;
      color: #f00;
      background: #000;
      padding: 2px 6px;
      letter-spacing: 2px;
      min-width: 3.2em;
      text-align: center;
      line-height: 1.1;
    }

    .counter.mines { justify-self: start; }
    .counter.timer { justify-self: end; }

    .face-btn {
      width: 44px;
      height: 44px;
      font-size: 26px;
      line-height: 1;
      padding: 0;
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      background: var(--win-gray);
      cursor: pointer;
    }

    .face-btn:active {
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
    }

    .board-wrap {
      overflow: auto;
      max-width: calc(100vw - 32px);
      touch-action: manipulation;
    }

    .board {
      display: grid;
      gap: 0;
      border: 3px solid;
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
      width: max-content;
      margin: 0 auto;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      min-width: 28px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: calc(var(--cell-size) * 0.62);
      line-height: 1;
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      background: var(--win-gray);
      touch-action: manipulation;
      cursor: pointer;
    }

    .cell.revealed {
      border: 1px solid #bdbdbd;
      border-color: #bdbdbd;
      background: #c0c0c0;
    }

    .cell.mine-hit {
      background: #f00;
    }

    .cell.flagged::after {
      content: "🚩";
      font-size: calc(var(--cell-size) * 0.55);
    }

    .cell.mine-wrong::after {
      content: "💣";
      font-size: calc(var(--cell-size) * 0.5);
    }

    .cell.mine-revealed::after {
      content: "💣";
      font-size: calc(var(--cell-size) * 0.5);
    }

    .cell.question::after {
      content: "?";
      color: #000;
    }

    /* 数字颜色：经典扫雷配色 */
    .n1 { color: #0000ff; }
    .n2 { color: #008000; }
    .n3 { color: #ff0000; }
    .n4 { color: #000080; }
    .n5 { color: #800000; }
    .n6 { color: #008080; }
    .n7 { color: #000000; }
    .n8 { color: #808080; }

    .hint {
      color: #e0ffff;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      max-width: 360px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      :root {
        --cell-size: clamp(28px, 9vw, 36px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>扫雷</h1>
    <div class="diff-bar" id="diffBar">
      <button type="button" data-diff="beginner" class="active">初级 9×9</button>
      <button type="button" data-diff="intermediate">中级 16×16</button>
      <button type="button" data-diff="expert">高级 16×30</button>
    </div>
    <div class="game-shell">
      <div class="top-panel">
        <div class="counter mines" id="mineCounter" aria-label="剩余地雷">010</div>
        <button type="button" class="face-btn" id="faceBtn" aria-label="重新开始">🙂</button>
        <div class="counter timer" id="timer" aria-label="计时">000</div>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid"></div>
      </div>
    </div>
    <p class="hint">单击翻开格子 · 长按插旗/取消旗<br>首次点击保证不是雷</p>
  </div>

  <script>
    // ========== 难度配置 ==========
    const DIFFICULTIES = {
      beginner: { rows: 9, cols: 9, mines: 10, label: '初级' },
      intermediate: { rows: 16, cols: 16, mines: 40, label: '中级' },
      expert: { rows: 16, cols: 30, mines: 99, label: '高级' }
    };

    // ========== 游戏状态 ==========
    let diffKey = 'beginner';
    let rows = 9, cols = 9, mineCount = 10;
    let grid = []; // 每格: { mine, adj, revealed, flagged }
    let gameOver = false;
    let gameWon = false;
    let firstClick = true;
    let flagsPlaced = 0;
    let timerSec = 0;
    let timerId = null;
    let pendingLongPress = null;

    const boardEl = document.getElementById('board');
    const mineCounterEl = document.getElementById('mineCounter');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');
    const diffBar = document.getElementById('diffBar');

    // ========== 工具函数 ==========
    function pad3(n) {
      const v = Math.max(-99, Math.min(999, n));
      const s = String(Math.abs(v));
      const sign = v < 0 ? '-' : '';
      return sign + s.padStart(3 - sign.length, '0');
    }

    function idx(r, c) {
      return r * cols + c;
    }

    function inBounds(r, c) {
      return r >= 0 && r < rows && c >= 0 && c < cols;
    }

    function neighbors(r, c) {
      const list = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc)) list.push([nr, nc]);
        }
      }
      return list;
    }

    function setFace(emoji) {
      faceBtn.textContent = emoji;
    }

    function updateMineCounter() {
      mineCounterEl.textContent = pad3(mineCount - flagsPlaced);
    }

    function updateTimerDisplay() {
      timerEl.textContent = pad3(timerSec);
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        if (timerSec < 999) {
          timerSec++;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // ========== 布雷（首击安全） ==========
    function placeMines(safeR, safeC) {
      const positions = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (r === safeR && c === safeC) continue;
          positions.push([r, c]);
        }
      }
      // Fisher-Yates 洗牌后取前 mineCount 个
      for (let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
      }
      for (let i = 0; i < mineCount; i++) {
        const [r, c] = positions[i];
        grid[idx(r, c)].mine = true;
      }
      // 计算邻雷数
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[idx(r, c)].mine) continue;
          let n = 0;
          for (const [nr, nc] of neighbors(r, c)) {
            if (grid[idx(nr, nc)].mine) n++;
          }
          grid[idx(r, c)].adj = n;
        }
      }
    }

    // ========== 渲染 ==========
    function scaleBoard() {
      const wrap = boardEl.parentElement;
      const shell = wrap.parentElement;
      const maxW = Math.min(window.innerWidth - 32, shell.clientWidth - 12);
      const boardW = cols * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-size'));
      if (boardW > maxW && maxW > 0) {
        const size = Math.floor(maxW / cols);
        document.documentElement.style.setProperty('--cell-size', Math.max(24, size) + 'px');
      }
    }

    function renderBoard() {
      boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
      boardEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.setAttribute('role', 'gridcell');
          bindCellEvents(cell, r, c);
          boardEl.appendChild(cell);
        }
      }
      scaleBoard();
      refreshCells();
    }

    function cellEl(r, c) {
      return boardEl.children[idx(r, c)];
    }

    function refreshCells() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          paintCell(r, c);
        }
      }
    }

    function paintCell(r, c, opts = {}) {
      const cell = cellEl(r, c);
      const g = grid[idx(r, c)];
      cell.className = 'cell';
      cell.textContent = '';

      if (g.revealed) {
        cell.classList.add('revealed');
        if (g.mine) {
          cell.classList.add('mine-revealed');
          if (opts.hit) cell.classList.add('mine-hit');
        } else if (g.adj > 0) {
          cell.textContent = g.adj;
          cell.classList.add('n' + g.adj);
        }
      } else if (g.flagged) {
        cell.classList.add('flagged');
      }
    }

    // ========== 游戏逻辑 ==========
    function reveal(r, c) {
      if (gameOver || gameWon) return;
      const g = grid[idx(r, c)];
      if (g.revealed || g.flagged) return;

      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        startTimer();
      }

      if (g.mine) {
        loseGame(r, c);
        return;
      }

      floodReveal(r, c);
      checkWin();
    }

    function floodReveal(r, c) {
      const stack = [[r, c]];
      while (stack.length) {
        const [cr, cc] = stack.pop();
        const g = grid[idx(cr, cc)];
        if (g.revealed || g.flagged || g.mine) continue;
        g.revealed = true;
        if (g.adj === 0) {
          for (const [nr, nc] of neighbors(cr, cc)) {
            const ng = grid[idx(nr, nc)];
            if (!ng.revealed && !ng.flagged && !ng.mine) {
              stack.push([nr, nc]);
            }
          }
        }
      }
      refreshCells();
    }

    function toggleFlag(r, c) {
      if (gameOver || gameWon) return;
      const g = grid[idx(r, c)];
      if (g.revealed) return;
      if (g.flagged) {
        g.flagged = false;
        flagsPlaced--;
      } else {
        g.flagged = true;
        flagsPlaced++;
      }
      updateMineCounter();
      paintCell(r, c);
    }

    function checkWin() {
      let hidden = 0;
      for (const g of grid) {
        if (!g.mine && !g.revealed) hidden++;
      }
      if (hidden === 0) {
        gameWon = true;
        stopTimer();
        setFace('😎');
        // 自动插旗剩余雷
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const g = grid[idx(r, c)];
            if (g.mine && !g.flagged) {
              g.flagged = true;
              flagsPlaced++;
            }
          }
        }
        updateMineCounter();
        refreshCells();
      }
    }

    function loseGame(hitR, hitC) {
      gameOver = true;
      stopTimer();
      setFace('😵');
      if (navigator.vibrate) {
        try { navigator.vibrate([80, 40, 120]); } catch (_) {}
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const g = grid[idx(r, c)];
          if (g.mine) {
            g.revealed = true;
          }
        }
      }
      refreshCells();
      paintCell(hitR, hitC, { hit: true });
    }

    function newGame() {
      stopTimer();
      timerSec = 0;
      updateTimerDisplay();
      gameOver = false;
      gameWon = false;
      firstClick = true;
      flagsPlaced = 0;
      setFace('🙂');
      updateMineCounter();

      grid = [];
      for (let i = 0; i < rows * cols; i++) {
        grid.push({ mine: false, adj: 0, revealed: false, flagged: false });
      }
      renderBoard();
    }

    function setDifficulty(key) {
      diffKey = key;
      const d = DIFFICULTIES[key];
      rows = d.rows;
      cols = d.cols;
      mineCount = d.mines;
      diffBar.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.diff === key);
      });
      newGame();
    }

    // ========== 触屏与鼠标 ==========
    const LONG_PRESS_MS = 450;
    const MOVE_TOLERANCE = 12;

    function bindCellEvents(el, r, c) {
      // 鼠标（桌面调试）
      el.addEventListener('mousedown', (e) => {
        if (e.button === 0 && !gameOver && !gameWon) setFace('😮');
      });
      el.addEventListener('mouseup', () => {
        if (!gameOver && !gameWon) setFace('🙂');
      });
      el.addEventListener('mouseleave', () => {
        if (!gameOver && !gameWon) setFace('🙂');
      });
      el.addEventListener('click', (e) => {
        e.preventDefault();
        if (e.button !== 0) return;
        reveal(r, c);
      });
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        toggleFlag(r, c);
      });

      // 触屏：单击翻开，长按插旗
      el.addEventListener('touchstart', (e) => {
        if (gameOver || gameWon) return;
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        pendingLongPress = {
          r, c,
          x: t.clientX,
          y: t.clientY,
          fired: false,
          timer: setTimeout(() => {
            if (!pendingLongPress || pendingLongPress.fired) return;
            pendingLongPress.fired = true;
            toggleFlag(r, c);
            if (navigator.vibrate) {
              try { navigator.vibrate(15); } catch (_) {}
            }
          }, LONG_PRESS_MS)
        };
        if (!gameOver && !gameWon) setFace('😮');
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (!pendingLongPress || pendingLongPress.r !== r) return;
        const t = e.touches[0];
        const dx = t.clientX - pendingLongPress.x;
        const dy = t.clientY - pendingLongPress.y;
        if (Math.hypot(dx, dy) > MOVE_TOLERANCE) {
          clearTimeout(pendingLongPress.timer);
          pendingLongPress = null;
        }
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (!pendingLongPress || pendingLongPress.r !== r || pendingLongPress.c !== c) {
          pendingLongPress = null;
          if (!gameOver && !gameWon) setFace('🙂');
          return;
        }
        clearTimeout(pendingLongPress.timer);
        if (!pendingLongPress.fired) {
          e.preventDefault();
          reveal(r, c);
        }
        pendingLongPress = null;
        if (!gameOver && !gameWon) setFace('🙂');
      });

      el.addEventListener('touchcancel', () => {
        if (pendingLongPress) clearTimeout(pendingLongPress.timer);
        pendingLongPress = null;
        if (!gameOver && !gameWon) setFace('🙂');
      });
    }

    // 禁止双击缩放
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    faceBtn.addEventListener('click', () => newGame());

    diffBar.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-diff]');
      if (btn) setDifficulty(btn.dataset.diff);
    });

    window.addEventListener('resize', scaleBoard);

    // 初始化
    setDifficulty('beginner');
  </script>
</body>
</html>
