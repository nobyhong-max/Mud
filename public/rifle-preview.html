<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>SpikeTactics rifle preview</title>
    <style>
      body { margin: 0; background: #0a1218; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(960, 540, false);
      renderer.setClearColor(0x0a1218);

      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(42, 960 / 540, 0.01, 20);
      cam.position.set(0.55, 0.18, 0.75);
      cam.lookAt(0, 0, 0.15);

      scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x223044, 0.9));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 4, 3);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x2ad4ff, 0.35);
      rim.position.set(-3, 1, -2);
      scene.add(rim);

      const loader = new GLTFLoader();
      loader.load('/models/tactical-rifle.glb', (gltf) => {
        const m = gltf.scene;
        m.rotation.set(-0.15, -Math.PI * 0.65, 0.08);
        m.position.set(-0.05, -0.02, 0);
        scene.add(m);
        window.__RIFLE_READY__ = true;
        renderer.render(scene, cam);
      });

      function tick() {
        requestAnimationFrame(tick);
        renderer.render(scene, cam);
      }
      tick();
    </script>
  </body>
</html>
