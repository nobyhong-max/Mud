<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>连线聊天 · hong noby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <section id="join-screen" class="panel join-panel">
      <header class="brand">
        <span class="brand-icon" aria-hidden="true">💬</span>
        <div>
          <h1>连线聊天</h1>
          <p class="subtitle">hong noby · 实时多人房间</p>
        </div>
      </header>
      <form id="join-form" class="join-form">
        <label>
          <span>昵称</span>
          <input type="text" id="nickname" name="nickname" maxlength="24" placeholder="你的昵称" autocomplete="nickname" required />
        </label>
        <label>
          <span>房间（可选）</span>
          <input type="text" id="room" name="room" maxlength="32" placeholder="默认：lobby" autocomplete="off" />
        </label>
        <p id="join-error" class="error" hidden></p>
        <button type="submit" class="btn primary">进入聊天</button>
      </form>
    </section>

    <section id="chat-screen" class="chat-layout" hidden>
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2 id="room-title">lobby</h2>
          <p class="you-as">你：<strong id="you-nick"></strong></p>
        </div>
        <div class="online-block">
          <h3>在线 <span id="online-count" class="badge">0</span></h3>
          <ul id="online-list" class="online-list"></ul>
        </div>
        <button type="button" id="leave-btn" class="btn ghost">离开房间</button>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <button type="button" id="toggle-online" class="btn icon-only mobile-only" aria-label="在线成员">👥</button>
          <div class="chat-header-text">
            <span id="room-title-mobile">lobby</span>
            <span class="muted" id="header-online">0 人在线</span>
          </div>
        </header>
        <ul id="messages" class="messages" role="log" aria-live="polite"></ul>
        <form id="message-form" class="composer">
          <input type="text" id="message-input" maxlength="2000" placeholder="输入消息…" autocomplete="off" />
          <button type="submit" class="btn primary send">发送</button>
        </form>
      </main>
    </section>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
