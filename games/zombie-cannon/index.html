<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a2f1a" />
  <title>尸潮炮阵 · 老二的小游戏</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="游戏画布"></canvas>

    <header class="hud" id="hud">
      <div class="hud-row">
        <span class="pill">波次 <strong id="wave">1</strong></span>
        <span class="pill">得分 <strong id="score">0</strong></span>
      </div>
      <div class="hud-row">
        <span class="pill base">基地 <strong id="base-hp">100</strong></span>
        <span class="pill kills">击杀 <strong id="kills">0</strong>/<span id="kills-next">10</span></span>
      </div>
    </header>

    <div class="overlay" id="overlay-start">
      <div class="panel">
        <h1>尸潮炮阵</h1>
        <p class="tagline">抬炮守线，一波更比一波凶</p>
        <ul class="help">
          <li>拖动屏幕<strong>瞄准</strong>，按住右侧<strong>开火</strong></li>
          <li>每击杀一定数量可选<strong>强化</strong>一项</li>
          <li>别让僵尸碰到基地防线</li>
        </ul>
        <button type="button" class="btn primary" id="btn-start">开始防守</button>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-upgrade">
      <div class="panel upgrade-panel">
        <h2>选择强化</h2>
        <p class="upgrade-hint">三选一，立即生效</p>
        <div class="upgrade-grid" id="upgrade-options"></div>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-gameover">
      <div class="panel">
        <h2 id="gameover-title">防线失守</h2>
        <p class="stats-line">波次 <span id="go-wave">0</span> · 得分 <span id="go-score">0</span></p>
        <button type="button" class="btn primary" id="btn-restart">再来一局</button>
      </div>
    </div>

    <button type="button" class="fire-btn" id="btn-fire" aria-label="开火">🔥</button>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
