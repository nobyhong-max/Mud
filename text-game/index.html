<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="description" content="404号末班车 — 一夜办公室文字冒险，你的选择决定能否搭上末班车回家。" />
    <title>404号末班车</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/game.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <p class="eyebrow">文字冒险 · 约 8 分钟</p>
        <h1>404号末班车</h1>
        <p class="tagline">雨夜加班，最后一班公交还有 20 分钟。电梯、同事、路口——每个选择都在改写的士票。</p>
      </header>

      <section class="hud" aria-label="状态">
        <div class="stat" title="理智">
          <span class="stat-label">理智</span>
          <div class="bar"><div class="bar-fill" id="bar-sanity"></div></div>
          <span class="stat-val" id="val-sanity">—</span>
        </div>
        <div class="stat" title="体力">
          <span class="stat-label">体力</span>
          <div class="bar"><div class="bar-fill" id="bar-stamina"></div></div>
          <span class="stat-val" id="val-stamina">—</span>
        </div>
        <div class="stat" title="人缘">
          <span class="stat-label">人缘</span>
          <div class="bar"><div class="bar-fill" id="bar-charm"></div></div>
          <span class="stat-val" id="val-charm">—</span>
        </div>
        <div class="score-pill" id="score-pill">结局 0/6</div>
      </section>

      <main class="stage">
        <article class="story" id="story" aria-live="polite"></article>
        <nav class="choices" id="choices" aria-label="选项"></nav>
      </main>

      <footer class="toolbar">
        <button type="button" class="btn ghost" id="btn-save">存档</button>
        <button type="button" class="btn ghost" id="btn-load">读档</button>
        <button type="button" class="btn" id="btn-restart">重新开始</button>
      </footer>
      <p class="toast" id="toast" role="status" hidden></p>
    </div>
    <script type="module" src="./js/game.js"></script>
  </body>
</html>
